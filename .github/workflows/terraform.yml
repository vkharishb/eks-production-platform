name: Terraform

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      action:
        description: Terraform action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
          - unlock
      allowed_cidr_blocks:
        description: JSON list of public CIDRs allowed to reach the EKS API
        required: true
        default: '["0.0.0.0/0"]'
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
jobs:
  terraform:
    name: Terraform ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'apply' }} (${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    env:
      TF_VAR_allowed_cidr_blocks: ${{ github.event_name == 'workflow_dispatch' && inputs.allowed_cidr_blocks || '["0.0.0.0/0"]' }}
      TF_CIDR_BLOCKS: ${{ github.event_name == 'workflow_dispatch' && inputs.allowed_cidr_blocks || '["0.0.0.0/0"]' }}
      TF_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'apply' }}
      TF_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Show Terraform trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "workflow_run_branch=${{ github.event.workflow_run.head_branch }}"
          echo "workflow_run_conclusion=${{ github.event.workflow_run.conclusion }}"
          echo "terraform_action=${TF_ACTION}"
          echo "terraform_environment=${TF_ENVIRONMENT}"

      - name: Check Terraform formatting
        if: env.TF_ACTION != 'unlock'
        working-directory: terraform/envs/${{ env.TF_ENVIRONMENT }}
        run: terraform fmt -check -recursive ../..

      - name: Terraform init
        if: env.TF_ACTION != 'unlock'
        working-directory: terraform/envs/${{ env.TF_ENVIRONMENT }}
        run: terraform init

      - name: Terraform validate
        if: env.TF_ACTION != 'unlock'
        working-directory: terraform/envs/${{ env.TF_ENVIRONMENT }}
        run: terraform validate

      - name: Show EKS API CIDRs
        if: env.TF_ACTION != 'unlock'
        working-directory: terraform/envs/${{ env.TF_ENVIRONMENT }}
        run: echo "Using allowed_cidr_blocks=${TF_CIDR_BLOCKS}"

      - name: Unlock Terraform state file
        if: env.TF_ACTION == 'unlock'
        working-directory: terraform/envs/${{ env.TF_ENVIRONMENT }}
        run: |
          case "${TF_ENVIRONMENT}" in
            dev)
              bucket="haris-eks-production-platform-tf-state-dev"
              key="envs/dev/terraform.tfstate"
              ;;
            prod)
              bucket="haris-eks-production-platform-tf-state-prod"
              key="envs/prod/terraform.tfstate"
              ;;
            *)
              echo "Unsupported environment: ${TF_ENVIRONMENT}"
              exit 1
              ;;
          esac

          lock_uri="s3://${bucket}/${key}.tflock"
          echo "Removing Terraform state lock file: ${lock_uri}"
          aws s3 rm "${lock_uri}"

      - name: Guard destroy environment
        if: env.TF_ACTION == 'destroy' && env.TF_ENVIRONMENT != 'dev'
        working-directory: terraform/envs/${{ env.TF_ENVIRONMENT }}
        run: |
          echo "Terraform destroy is only allowed for the dev environment."
          exit 1

      - name: Terraform plan
        if: env.TF_ACTION == 'plan' || env.TF_ACTION == 'apply'
        working-directory: terraform/envs/${{ env.TF_ENVIRONMENT }}
        run: terraform plan -input=false -var="allowed_cidr_blocks=${TF_CIDR_BLOCKS}"

      - name: Terraform destroy plan
        if: env.TF_ACTION == 'destroy' && env.TF_ENVIRONMENT == 'dev'
        working-directory: terraform/envs/${{ env.TF_ENVIRONMENT }}
        run: terraform plan -destroy -input=false -var="allowed_cidr_blocks=${TF_CIDR_BLOCKS}"

      - name: Terraform apply
        if: env.TF_ACTION == 'apply'
        working-directory: terraform/envs/${{ env.TF_ENVIRONMENT }}
        run: terraform apply -input=false -auto-approve -var="allowed_cidr_blocks=${TF_CIDR_BLOCKS}"

      - name: Terraform destroy
        if: env.TF_ACTION == 'destroy' && env.TF_ENVIRONMENT == 'dev'
        working-directory: terraform/envs/${{ env.TF_ENVIRONMENT }}
        run: terraform destroy -input=false -auto-approve -var="allowed_cidr_blocks=${TF_CIDR_BLOCKS}"
