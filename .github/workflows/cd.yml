name: CD

on:
  workflow_run:
    workflows:
      - Terraform
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_NAME: eks-production
  NAMESPACE: production
  CHART_PATH: helm/eks-production-platform

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Download Terraform outputs artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: terraform-outputs
          workflow: terraform.yml
          workflow_conclusion: success
          # run_id is only available on workflow_run triggers;
          # on workflow_dispatch it is empty and causes the download to fail.
          # Omitting run_id makes the action fetch from the latest successful run,
          # which is correct for both trigger types.
          path: terraform-outputs/

      - name: Show Terraform outputs
        run: cat terraform-outputs/terraform-output.json


      - name: Set Terraform output variables
        id: tf_outputs
        run: |
          echo "=== Terraform outputs ==="
          cat terraform-outputs/terraform-output.json

          CLUSTER_NAME=$(jq -r '.cluster_name.value' terraform-outputs/terraform-output.json)
          CLUSTER_ENDPOINT=$(jq -r '.cluster_endpoint.value' terraform-outputs/terraform-output.json)

          echo "cluster_name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT
          echo "cluster_endpoint=${CLUSTER_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "Cluster: ${CLUSTER_NAME} | Endpoint: ${CLUSTER_ENDPOINT}"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ steps.tf_outputs.outputs.cluster_name }}

      - name: Verify kubectl connection
        run: kubectl get nodes

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Create namespace if not exists
        run: |
          kubectl get namespace ${{ env.NAMESPACE }} \
            || kubectl create namespace ${{ env.NAMESPACE }}

      - name: Helm upgrade / install
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} ${{ env.CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --values ${{ env.CHART_PATH }}/values.yaml \
            --set image.tag=${{ github.sha }} \
            --atomic \
            --timeout 5m \
            --wait

      - name: Verify deployment
        run: |
          helm status ${{ env.RELEASE_NAME }} --namespace ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.RELEASE_NAME }} \
            --namespace ${{ env.NAMESPACE }}
