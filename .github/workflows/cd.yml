name: CD

on:
  workflow_run:
    workflows:
      - Terraform
    types:
      - completed

permissions:
  contents: read
  id-token: write
  actions: read  # required by dawidd6/action-download-artifact to list artifacts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_NAME: eks-production
  NAMESPACE: production
  CHART_PATH: helm/eks-production-platform

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Uncomment below and remove key/secret above to use OIDC (recommended)
          # role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Download Terraform outputs artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform.yml
          workflow_conclusion: success
          # Pin to the exact run that triggered this CD workflow
          run_id: ${{ github.event.workflow_run.id }}
          name: terraform-outputs
          path: terraform/terraform-outputs/

      - name: Show Terraform outputs
        run: cat terraform/terraform-outputs/terraform-output.json

      - name: Set Terraform output variables
        run: |
          CLUSTER_NAME=$(jq -r '.cluster_name.value' terraform/terraform-outputs/terraform-output.json)
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}

      - name: Verify kubectl connection
        run: kubectl get nodes

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Create namespace if not exists
        run: |
          kubectl get namespace ${{ env.NAMESPACE }} \
            || kubectl create namespace ${{ env.NAMESPACE }}

      - name: Helm upgrade / install
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} ${{ env.CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --values ${{ env.CHART_PATH }}/values.yaml \
            --set image.tag=${{ github.sha }} \
            --atomic \
            --timeout 5m \
            --wait

      - name: Verify deployment
        run: |
          helm status ${{ env.RELEASE_NAME }} --namespace ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.RELEASE_NAME }} \
            --namespace ${{ env.NAMESPACE }} \
            --timeout=5m