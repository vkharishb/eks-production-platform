name: CD

on:
  workflow_run:
    workflows:
      - Terraform
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  packages: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  build:
    name: Build and push image
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev')
    runs-on: ubuntu-latest
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Prepare image metadata
        id: image
        run: |
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="${IMAGE_SHA::12}"
          echo "repository=${image_repository}" >> "$GITHUB_OUTPUT"
          echo "tag=${image_tag}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}

  deploy-dev:
    name: Deploy dev
    needs: build
    if: github.event_name == 'workflow_run' || inputs.environment == 'dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_DEV_CLUSTER_NAME || 'eks-cluster-dev' }}

      - name: Install AWS Load Balancer Controller
        run: |
          aws_account_id="$(aws sts get-caller-identity --query Account --output text)"
          vpc_id="$(aws eks describe-cluster --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}" --query "cluster.resourcesVpcConfig.vpcId" --output text)"
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="${EKS_CLUSTER_NAME}" \
            --set region="${AWS_REGION}" \
            --set vpcId="${vpc_id}" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::${aws_account_id}:role/${EKS_CLUSTER_NAME}-alb-controller" \
            --wait
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_DEV_CLUSTER_NAME || 'eks-cluster-dev' }}

      - name: Apply Kubernetes platform manifests
        run: |
          kubectl apply -f k8s/namespaces/dev.yml
          kubectl apply -f k8s/network/default-deny.yaml
          kubectl apply -f k8s/network/allow-internal.yaml
          kubectl apply -f k8s/quotas/dev-quota.yaml
          kubectl apply -f k8s/limits/default-limits.yaml
          kubectl apply -f k8s/rbac/readonly-role.yaml
          kubectl apply -f k8s/rbac/readonly-binding.yaml
          kubectl apply -f k8s/storage/storage-class.yaml

      - name: Deploy Helm release
        run: |
          helm upgrade --install hello-app helm/apps/hello-app \
            --namespace dev \
            --create-namespace \
            --values helm/apps/hello-app/values.yaml \
            --values helm/apps/hello-app/values-dev.yml \
            --set image.repository="${IMAGE_REPOSITORY}" \
            --set image.tag="${IMAGE_TAG}"
        env:
          IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

      - name: Verify rollout
        run: kubectl rollout status deployment/hello-app --namespace dev

  deploy-prod:
    name: Deploy prod
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_PROD_CLUSTER_NAME || 'eks-cluster-prod' }}

      - name: Install AWS Load Balancer Controller
        run: |
          aws_account_id="$(aws sts get-caller-identity --query Account --output text)"
          vpc_id="$(aws eks describe-cluster --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}" --query "cluster.resourcesVpcConfig.vpcId" --output text)"
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="${EKS_CLUSTER_NAME}" \
            --set region="${AWS_REGION}" \
            --set vpcId="${vpc_id}" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=arn:aws:iam::${aws_account_id}:role/${EKS_CLUSTER_NAME}-alb-controller" \
            --wait
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_PROD_CLUSTER_NAME || 'eks-cluster-prod' }}

      - name: Apply Kubernetes platform manifests
        run: |
          kubectl apply -f k8s/namespaces/prod.yml
          kubectl apply -f k8s/network/prod-network-policies.yaml
          kubectl apply -f k8s/quotas/prod-quota.yaml
          kubectl apply -f k8s/limits/prod-limits.yaml
          kubectl apply -f k8s/rbac/prod-rbac.yaml
          kubectl apply -f k8s/storage/storage-class.yaml

      - name: Deploy Helm release
        run: |
          helm upgrade --install hello-app helm/apps/hello-app \
            --namespace prod \
            --create-namespace \
            --values helm/apps/hello-app/values.yaml \
            --values helm/apps/hello-app/values-prod.yml \
            --set image.repository="${IMAGE_REPOSITORY}" \
            --set image.tag="${IMAGE_TAG}"
        env:
          IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

      - name: Verify rollout
        run: kubectl rollout status deployment/hello-app --namespace prod
