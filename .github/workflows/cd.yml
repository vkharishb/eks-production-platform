name: CD

on:
  workflow_run:
    workflows:
      - Terraform
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_NAME: hello
  NAMESPACE: production
  CHART_PATH: ./helm/apps/hello-app
  ACTIONS_STEP_DEBUG: true      # enables step debug logs
  ACTIONS_RUNNER_DEBUG: true    # enables runner debug logs

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActionsCD

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name eks-cluster-dev

      - name: Verify kubectl connection
        run: kubectl get nodes

      - name: Debug chart path
        run: ls -la helm/apps/hello-app/

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Create namespace if not exists
        run: |
          kubectl get namespace ${{ env.NAMESPACE }} \
            || kubectl create namespace ${{ env.NAMESPACE }}

      - name: Helm upgrade / install
        run: |
          helm upgrade --install ${{ env.RELEASE_NAME }} ${{ env.CHART_PATH }} \
            --namespace ${{ env.NAMESPACE }} \
            --values ${{ env.CHART_PATH }}/values.yaml \
            --set image.tag=${{ github.sha }} \
            --rollback-on-failure \
            --timeout 5m \
            --wait

      - name: Verify deployment
        run: |
          helm status ${{ env.RELEASE_NAME }} --namespace ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.RELEASE_NAME }}-hello-app \
          --namespace ${{ env.NAMESPACE }}