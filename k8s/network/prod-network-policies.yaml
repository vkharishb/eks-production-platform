apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: hello-app
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hello-app
      ports:
        - port: 5678
          protocol: TCP